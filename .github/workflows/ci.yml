name: CI

# Build on every push and pull request.
# Publish the package on a v* tag and on push to main. Already published versions are skipped,
# so a main push only publishes when .alvaorc contains a new version.
on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build generator
        run: dotnet build scrapper.csproj

      - name: Build library
        run: dotnet build Alvao/Alvao.csproj --configuration Release

      # Examples reference the local library (Examples/shared.csproj), so they check the generated API
      - name: Build examples
        run: |
          for example in Examples/*/; do
            echo "::group::$example"
            dotnet build "$example"
            echo "::endgroup::"
          done

  publish:
    name: Publish
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub release
      packages: write # GitHub Packages
      id-token: write # nuget.org trusted publishing
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        run: |
          version="$(tr -d '[:space:]' < .alvaorc)"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match .alvaorc ($version)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Pack
        run: dotnet pack Alvao/Alvao.csproj --configuration Release -p:Version="$VERSION" --output artifacts

      # Short-lived API key from nuget.org (requires trusted publishing policy for this workflow)
      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget
        with:
          user: Ash258

      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Push to GitHub Packages
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.GITHUB_TOKEN }}" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --skip-duplicate

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/*.nupkg --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg --title "$GITHUB_REF_NAME" --generate-notes
          fi
